name: tg_alert_monitor
description: "Watches Telegram folder channels for keywords and relays hits to a bot channel."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Foreground service that keeps TDLib alive with the screen off and after boot.
  flutter_foreground_task: ^11.0.2
  # FFI wrapper around libtdjson.so.
  ffi: ^2.1.0
  # TDLib database / files / matches.jsonl locations.
  path_provider: ^2.1.0
  # Configuration, shared between the UI and the service isolate.
  shared_preferences: ^2.5.0
  # The local alert notification and its siren channel.
  flutter_local_notifications: ^22.3.0
  # Opens a match in Telegram from the journal.
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  intl: any
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  http: ^1.6.0
  audioplayers: ^6.8.1
  # Generates a per-keyword spoken alert with the device's own TTS engine.
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Deterministic timer control in ForwardQueue tests.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  # Builds lib/l10n/app_localizations.dart from the .arb files (see l10n.yaml).
  generate: true

  # Master copy of the siren. Android plays it from the notification channel,
  # so the file the app actually sounds is the identical copy in
  # android/app/src/main/res/raw/ — a raw resource is the only thing a channel
  # can be given as its sound.
  assets:
    - assets/siren_ostap_calm.ogg
